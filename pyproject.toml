[project]
name = "pymergetic-wasmmod"
dynamic = ["version"]
description = "wasmmod — tools + bundled source tree in one install (native runtime is the sibling Rust crate, consumed via Cargo)"
readme = "docs/PYPI.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = [
  "pymergetic-wasmmod-tools>=0.2.0a1",
]

[project.urls]
Homepage = "https://github.com/pymergetic-wasmmod/wasmmod"
Documentation = "https://github.com/pymergetic-wasmmod/wasmmod#readme"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Only ship pymergetic.wasmmod.rt from the unified src/ tree — not the
# guest-tree __init__.py / C / Rust under src/pymergetic/wasmmod/ (those
# stay checkout/Cargo material). Parents stay PEP 420 namespaces.
[tool.setuptools.packages.find]
where = ["src"]
include = ["pymergetic.wasmmod.rt*"]
namespaces = true

[tool.setuptools.package-data]
"pymergetic.wasmmod.rt" = ["py.typed", "share/**/*"]

[tool.setuptools_scm]
root = "."
search_parent_directories = false
version_file = "src/pymergetic/wasmmod/rt/_version.py"
fallback_version = "0.2.0a1"

[tool.ruff]
line-length = 100
target-version = "py311"
