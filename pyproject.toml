[project]
name = "pymergetic-wasmmod"
dynamic = ["version"]
description = "wasmmod source tree + host entry (signed Wasm/AOT/ELF packs for MicroPython)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = [
  "pymergetic-wasmmod-tools>=0.1.0a1",
]

[project.urls]
Homepage = "https://github.com/pymergetic/wasmmod"
Documentation = "https://github.com/pymergetic/wasmmod#readme"

[project.optional-dependencies]
tools = ["pymergetic-wasmmod-tools>=0.1.0a1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = false }
fallback-version = "0.1.0a1"

[tool.hatch.build.targets.wheel]
packages = ["python/pymergetic"]
# Dev-only symlink → nested submodule dev/tools (IDE / PYTHONPATH=python). Not shipped.
exclude = ["python/pymergetic/wasmmod/tools"]

# hatch_build.py stages python/pymergetic/wasmmod/rt/share/ (cleaned checkout).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = [
  "python",
  "hatch_build.py",
  "loader.c",
  "wasmmod.c",
  "crates",
  "format",
  "ports",
  "examples",
  "tools/wasmmod.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
