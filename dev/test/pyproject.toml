[project]
name = "pymergetic-wasmmod-test"
dynamic = ["version"]
description = "Independent wasmmod consumer — build packs/ELF and exercise CDN publish"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = [
  "pymergetic-wasmmod-tools>=0.1.0a1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
cdn = [
  "pymergetic-wasmmod-cdn-client>=0.1.0a3",
]

[project.urls]
Homepage = "https://github.com/pymergetic-wasmmod/wasmmod-test"
Documentation = "https://github.com/pymergetic-wasmmod/wasmmod-test#readme"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymergetic*"]
namespaces = true

[tool.setuptools.package-data]
"pymergetic.wasmmod.test" = ["py.typed"]

[tool.setuptools_scm]
root = "."
search_parent_directories = false
version_file = "src/pymergetic/wasmmod/test/_version.py"
fallback_version = "0.1.0a1"

[tool.ruff]
line-length = 100
target-version = "py311"
