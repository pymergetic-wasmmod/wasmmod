# Depends on the hello pack at runtime (guest→guest via micropython.imports).
type = "package"
name = "client"
version = "0.1.0"
impl = ["c"]
comment = "Calls hello.hello through a Wasm import forwarder."

[native]
dir = "."
sources = ["client.c"]

[lifecycle]
load = "mp_pack_load"
unload = "mp_pack_unload"

[[exports]]
func = "use_hello"

[[imports]]
module = "hello"
func = "hello"
