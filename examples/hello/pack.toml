# Pack manifest (see ../../docs/PACK.md; examples/PACK.md is a symlink).

type = "package"
name = "hello"
version = "0.1.0"
impl = ["c"]
comment = "Minimal freestanding demo: src/ natives + Python tree."
description = "Hello world wasmmod pack (native + Python tree)."
license = "MIT"

# Defaults: native.dir = "src", python.mount = "src" (strip src/ from module paths).
[python]
keep_source = true
# TESTING: all bytecode targets enabled (trim / set freeze=false later).
freeze = true
targets = [
  "upy:mpy6:sib31",
  "upy:mpy6:sib63",
  "cpy:cp312",
  "cpy:cp313",
  "cpy:cp314",
]

[lifecycle]
load = ""
unload = ""

[[exports]]
func = "hello"

[[exports]]
func = "add"

# Embed pack sources into wasmmod.source (also: pack --with-source).
[source]
embed = true
compress = true

# Per-file zlib for pack .py/.mpy/.pyc (pack v3; default on).
[pack]
compress = true
