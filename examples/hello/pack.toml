# MicroPython wasm pack manifest (see ../PACK.md).
# Pack manifest (see ../PACK.md).

type = "package"
name = "hello"
version = "0.1.0"
impl = ["c"]
comment = "Minimal freestanding demo: src/ natives + Python tree."

# Defaults: native.dir = "src", python.mount = "src" (strip src/ from module paths).
[python]
keep_source = true
# TESTING: all bytecode targets enabled (trim / set freeze=false later).
freeze = true
targets = [
  "upy:mpy6:sib31",
  "upy:mpy6:sib63",
  "cpy:cp312",
  "cpy:cp313",
  "cpy:cp314",
]

[lifecycle]
load = ""
unload = ""

[[exports]]
func = "hello"

[[exports]]
func = "add"
