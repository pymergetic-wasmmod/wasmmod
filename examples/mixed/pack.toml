# Tiny mixed C + Rust pack (C ABI at the Wasm boundary).
type = "package"
name = "pymergetic.wasmmod_examples.mixed"
version = "0.1.0"
impl = ["c", "rs"]
comment = "Smoke for multi-language native link in wasm_pack."

# Defaults: native.dir = "src" (src/shim.c + src/lib.rs).

[[exports]]
func = "mixed_answer"
export = "mixed_answer"

[[exports]]
func = "mixed_i64"

# Embed pack sources into wasmmod.source (CDN Inspect / locations).
[source]
embed = true
compress = true

