# Full call-matrix bridge: C+RS natives, guest→guest, guest→host, rich types.
type = "package"
name = "pymergetic.wasmmod_examples.bridge"
version = "0.1.0"
impl = ["c", "rs"]
comment = "Py-callable bridge covering C/RS/host/peer + i64/f32/f64/mem/handles."
description = "Bridge pack exercising host/peer/typed call paths."
license = "MIT"

# Defaults: native.dir = "src", python.mount = "src".
[python]
keep_source = true
# TESTING: all bytecode targets enabled (trim / set freeze=false later).
freeze = true
targets = [
  "upy:mpy6:sib31",
  "upy:mpy6:sib63",
  "cpy:cp312",
  "cpy:cp313",
  "cpy:cp314",
]

[lifecycle]
load = "mp_pack_load"
unload = "mp_pack_unload"

[deps]
"pymergetic.wasmmod_examples.hello" = "0.1.0"
"pymergetic.wasmmod_examples.mixed" = "0.1.0"

# --- Rust exports ---
[[exports]]
func = "rs_square"

[[exports]]
func = "rs_add3"

[[exports]]
