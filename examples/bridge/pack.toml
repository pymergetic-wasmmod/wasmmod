# Full call-matrix bridge: C+RS natives, guest→guest, guest→host, rich types.
type = "package"
name = "bridge"
version = "0.1.0"
impl = ["c", "rs"]
comment = "Py-callable bridge covering C/RS/host/peer + i64/f32/f64/mem/handles."

[native]
dir = "."
sources = ["bridge.c", "lib.rs"]

[python]
mount = "py"
keep_source = true
# TESTING: all bytecode targets enabled (trim / set freeze=false later).
freeze = true
targets = [
  "upy:mpy6:sib31",
  "upy:mpy6:sib63",
  "cpy:cp312",
  "cpy:cp313",
  "cpy:cp314",
]

[lifecycle]
load = "mp_pack_load"
unload = "mp_pack_unload"

# --- Rust exports ---
[[exports]]
func = "rs_square"
sig = "i32_i32"

[[exports]]
func = "rs_add3"
sig = "i32_i32_i32_i32"

