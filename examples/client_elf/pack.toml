# Pack manifest for ELF client (peer import of hello via MPWI).

type = "package"
name = "client"
version = "0.1.0"
impl = ["c"]
comment = "ELF twin of client.wasm — calls hello through in-tree undef resolve."

[deps]
hello = "0.1.0"

[lifecycle]
load = "mp_pack_load"
unload = "mp_pack_unload"

[[exports]]
func = "use_hello"
sig = "i32"

[[imports]]
module = "hello"
func = "hello"
