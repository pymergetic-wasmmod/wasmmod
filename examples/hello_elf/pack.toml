# Pack manifest for ELF container demo (see ../../docs/PACK.md).
# Python tree is shared with examples/hello (same package name).

type = "package"
name = "hello"
version = "0.1.0"
impl = ["c"]
comment = "ELF64 ET_REL twin of hello.wasm — same register/connect, no WAMR."

[lifecycle]
load = ""
unload = ""

[[exports]]
func = "hello"
sig = "i32"

[[exports]]
func = "add"
sig = "i32_i32_i32"

[python]
mount = "../hello/src"
keep_source = true
freeze = true
targets = [
  "upy:mpy6:sib31",
  "upy:mpy6:sib63",
]

[pack]
compress = true
