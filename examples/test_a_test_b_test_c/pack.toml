# Nested leaf pack; [deps] pulls sibling test_a.test_d.
type = "package"
name = "pymergetic.wasmmod_examples.test_a.test_b.test_c"
version = "0.1.0"
impl = ["c", "rs"]
comment = "Dotted-tree leaf that depends on test_a.test_d."
description = "Package test_a.test_b.test_c for module-tree e2e."
license = "MIT"

[python]
keep_source = true
freeze = false

[lifecycle]
load = "mp_pack_load"
unload = "mp_pack_unload"

[deps]
"pymergetic.wasmmod_examples.test_a.test_d" = "0.1.0"

[[exports]]
func = "c_answer"

[[exports]]
func = "c_rs_tag"

# Imports (test_a.test_d.d_value) are auto-discovered from the compiled
# wasm's own import section — no manifest declaration needed.

# Embed pack sources into wasmmod.source (CDN Inspect / locations).
[source]
embed = true
compress = true

