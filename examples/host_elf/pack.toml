# Pack: ELF guest → wasmmod.host / wasmmod (native pointers, no linear mem).

type = "package"
name = "hostcall"
version = "0.1.0"
impl = ["c"]
comment = "ELF pack that calls Python via wasmmod.host slots (buf/mem/py + loader version)."

[[exports]]
func = "via_host0"
sig = "i32"

[[exports]]
func = "via_host"
sig = "i32_i32"

[[exports]]
func = "host_mode"
sig = "i32"

[[exports]]
func = "via_buf"
sig = "i32"

[[exports]]
func = "via_mem"
sig = "i32"

[[exports]]
func = "via_py"
sig = "i32_i32"

[[exports]]
func = "host_version_len"
sig = "i32"

[[imports]]
module = "wasmmod.host"
func = "call0_i32"

[[imports]]
module = "wasmmod.host"
func = "call_i32"

[[imports]]
module = "wasmmod.host"
func = "call_buf"

[[imports]]
module = "wasmmod.host"
func = "call_mem"

[[imports]]
module = "wasmmod.host"
func = "mem_alloc"

[[imports]]
module = "wasmmod.host"
func = "mem_copy_in"

[[imports]]
module = "wasmmod.host"
func = "mem_free"

[[imports]]
module = "wasmmod.host"
func = "call_py"

[[imports]]
module = "wasmmod"
func = "mode"

[[imports]]
module = "wasmmod"
func = "version"

[source]
embed = true
compress = true
