# Pack: ELF guest → wasmmod.host.call0_i32 / call_i32.

type = "package"
name = "hostcall"
version = "0.1.0"
impl = ["c"]
comment = "ELF pack that calls Python via wasmmod.host slots."

[[exports]]
func = "via_host0"
sig = "i32"

[[exports]]
