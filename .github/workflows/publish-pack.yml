# Build a wasmmod pack and publish to metal-cdn (one-shot CLI).
# Default: wasm + AOT + ELF (when a sibling *_elf demo exists). Use aot=false for wasm-only.
name: publish-pack

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Pack directory (relative to wasmmod root)
        required: true
        default: examples/hello
      version:
        description: Package version
        required: true
      package:
        description: Override package name (default pack.toml)
        required: false
        default: ""
      aot:
        description: Compile AOT via wamrc (default on)
        required: false
        type: boolean
        default: true
      elf:
        description: Extra .elf path (default auto / sibling *_elf make)
        required: false
        default: ""
      no_elf:
        description: Skip ELF twins
        required: false
        type: boolean
        default: false
      arch:
        description: Arch infix for AOT/ELF CDN names (e.g. x86_64; default host)
        required: false
        default: ""
      cdn_url:
        description: metal-cdn base URL
        required: true
  push:
    tags:
      - "pack-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publish deps
        run: |
          pip install -r requirements-publish.txt
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Resolve version / pack
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pack=${{ inputs.pack }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "package=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
            echo "aot=${{ inputs.aot }}" >> "$GITHUB_OUTPUT"
            echo "elf=${{ inputs.elf }}" >> "$GITHUB_OUTPUT"
            echo "no_elf=${{ inputs.no_elf }}" >> "$GITHUB_OUTPUT"
            arch="${{ inputs.arch }}"
            if [ -z "$arch" ]; then arch="$(uname -m)"; fi
            echo "arch=$arch" >> "$GITHUB_OUTPUT"
            echo "cdn_url=${{ inputs.cdn_url }}" >> "$GITHUB_OUTPUT"
          else
            # tag pack-<name>-<version> e.g. pack-hello-0.1.0
            ref="${GITHUB_REF_NAME#pack-}"
            name="${ref%-*}"
            ver="${ref##*-}"
            echo "pack=examples/${name}" >> "$GITHUB_OUTPUT"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "package=${name}" >> "$GITHUB_OUTPUT"
            echo "aot=true" >> "$GITHUB_OUTPUT"
            echo "elf=" >> "$GITHUB_OUTPUT"
            echo "no_elf=false" >> "$GITHUB_OUTPUT"
            echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
            echo "cdn_url=${{ vars.METAL_CDN_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write signing material
        env:
          WASMMOD_SIGN_KEY: ${{ secrets.WASMMOD_SIGN_KEY }}
          WASMMOD_SIGN_CHAIN: ${{ secrets.WASMMOD_SIGN_CHAIN }}
        run: |
          mkdir -p .keys/sign
          printf '%s\n' "$WASMMOD_SIGN_KEY" > .keys/sign/leaf.key.pem
          printf '%s\n' "$WASMMOD_SIGN_CHAIN" | base64 -d > .keys/sign/chain.der
          chmod 600 .keys/sign/leaf.key.pem

      - name: Build matching wamrc
        if: steps.meta.outputs.aot == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y cmake g++ llvm-dev liblld-dev
          LLVM_DIR="$(llvm-config --cmakedir)"
          cmake -S third_party/wamr/wamr-compiler -B build-wamrc \
            -DWAMR_BUILD_WITH_CUSTOM_LLVM=1 \
            -DLLVM_DIR="$LLVM_DIR"
          cmake --build build-wamrc -j"$(nproc)"
          echo "WAMRC=${GITHUB_WORKSPACE}/build-wamrc/wamrc" >> "$GITHUB_ENV"

      - name: Build ELF twin (sibling *_elf)
        if: steps.meta.outputs.no_elf != 'true' && steps.meta.outputs.elf == ''
        run: |
          set -euo pipefail
          pack="${{ steps.meta.outputs.pack }}"
          base="$(basename "$pack")"
          elf_dir="examples/${base}_elf"
          if [ -d "$elf_dir" ]; then
            echo "Building ELF twin via $elf_dir"
            make -C "$elf_dir"
          else
            echo "No $elf_dir — publish will skip auto-elf if none under packs/"
          fi

      - name: Publish
        env:
          METAL_CDN_URL: ${{ steps.meta.outputs.cdn_url }}
          METAL_CDN_TOKEN: ${{ secrets.METAL_CDN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p packs
          args=(
            tools/wasmmod.py publish "${{ steps.meta.outputs.pack }}"
            --version "${{ steps.meta.outputs.version }}"
            --key .keys/sign/leaf.key.pem
            --chain .keys/sign/chain.der
            --cdn-url "$METAL_CDN_URL"
            --token "$METAL_CDN_TOKEN"
            --claim
            -o packs
          )
          if [ -n "${{ steps.meta.outputs.package }}" ]; then
            args+=(--package "${{ steps.meta.outputs.package }}")
          fi
          if [ "${{ steps.meta.outputs.aot }}" != "true" ]; then
            args+=(--no-aot)
          fi
          if [ "${{ steps.meta.outputs.no_elf }}" = "true" ]; then
            args+=(--no-elf)
          elif [ -n "${{ steps.meta.outputs.elf }}" ]; then
            args+=(--elf "${{ steps.meta.outputs.elf }}")
          fi
          if [ -n "${{ steps.meta.outputs.arch }}" ]; then
            args+=(--arch "${{ steps.meta.outputs.arch }}")
          fi
          python3 "${args[@]}"
