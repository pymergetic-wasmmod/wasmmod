[project]
name = "pymergetic-wasmmod"
dynamic = ["version"]
description = "wasmmod — WAMR-based Wasm/AOT/ELF module loader & registry (Python namespace root; native runtime is the sibling Rust crate, consumed via Cargo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]

[project.urls]
Homepage = "https://github.com/pymergetic-wasmmod/wasmmod"
Documentation = "https://github.com/pymergetic-wasmmod/wasmmod#readme"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymergetic*"]
namespaces = true

[tool.setuptools.package-data]
"pymergetic.wasmmod" = ["py.typed"]

[tool.setuptools_scm]
# pyproject lives in python/; git root is the parent repo.
root = ".."
search_parent_directories = false
version_file = "pymergetic/wasmmod/_version.py"
fallback_version = "0.1.0a1"

[tool.ruff]
line-length = 100
target-version = "py311"
