[package]
name = "pymergetic-wasmmod"
version = "0.1.0"
edition = "2024"
publish = false
description = "wasmmod: the pm_mod registry, wasm/aot/elf containers, and the pymergetic.util crates it stands on"

[lib]
name = "pymergetic_wasmmod"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
# bundle-mbedtls: cargo test / CPython have no µPy ssl objects.
# µPy unix already compiles lib/mbedtls — pass --no-default-features.
default = ["bundle-mbedtls"]
upy-host = []
bundle-mbedtls = []
# Host facegen via pymergetic.util.gen (std + toml). Not for freestanding staticlib.
gen = ["dep:toml"]
# Alias — CELLBUILD "build-machinery" name (same as gen today).
build-machinery = ["gen"]

[[bin]]
name = "wasmmod-gen"
path = "src/pymergetic/util/gen/cli.rs"
required-features = ["gen"]

[dependencies]
toml = { version = "0.8", optional = true }
# JSON index parsing for the CDN pack list/search/filter card
# (`pymergetic.wasmmod.net.search`, impl = rs). `no_std`-safe with only `alloc`;
# navigation uses `serde_json::Value` — no `serde` derive, no proc-macro.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"

[build-dependencies]
cc = "1"
cmake = "0.1"
