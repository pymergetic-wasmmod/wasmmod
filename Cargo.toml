[package]
name = "pymergetic-wasmmod"
version = "0.1.0"
edition = "2024"
publish = false
description = "wasmmod: the pm_mod registry, wasm/aot/elf containers, and the pymergetic.util crates it stands on"

[lib]
name = "pymergetic_wasmmod"
path = "src/lib.rs"
# rlib for cargo test / path deps; staticlib for MICROPY_PY_WASM=1 link.
crate-type = ["rlib", "staticlib"]

[features]
default = []
# Enables the libc GlobalAlloc + panic_handler used by the staticlib when
# embedded in micropython-wasmmod. Required for `cargo build --features upy-host`.
upy-host = []

# Host/no_std staticlib must abort on panic (no unwinding without std).
[profile.release]
panic = "abort"

# build.rs's job: compile pymergetic.util.mem's C impl (+ vendored TLSF) and
# build WAMR's `vmlib` (third_party/wamr) as a static lib for
# pymergetic.wasmmod.loader to link against. Neither pm_util_mem's C nor
# WAMR is otherwise part of a normal `cargo build` — see build.rs.
[build-dependencies]
cc = "1"
cmake = "0.1"
